<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Tom's Bookshelf</title>
        <meta name="description" content="A simple bookshelf site for task 3.1P">
        <meta name="author" content="Tom Borg">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <nav>
            <div class="nav-wrapper navbar-size">
              <a href="" class="brand-logo center">Tom's Bookshelf</a>

              <ul id="nav-mobile" class="left hide-on-med-and-down">
                  <li><a href="#">Wishlist</a></li>
                  <li><a href="#">Library</a></li>
              </ul>
            </div>
        </nav>

        <main class="container">
            <div class="row" style="margin-top: 20px;">
                <div class="col s12 right-align">
                    <a class="waves-effect waves-light btn modal-trigger" href="#book-modal">
                        Add a Book
                    </a>
                </div>
            </div>

            <div class="row" id="card-section">
                <!-- Example book card -->
                <div class="col s12 m6 l4">
                    <div class="card hoverable">
                        <div class="card-image">
                            <img src="https://covers.openlibrary.org/b/isbn/9780441172719-L.jpg" alt="Dune Cover">
                          </div>
                          <div class="card-content">
                            <span class="card-title">Dune</span>
                            <p><strong>Author:</strong> Frank Herbert</p>
                            <p>A classic sci-fi novel set on the desert planet Arrakis.</p>
                        </div>
                        <div class="card-action">
                            <a class="modal-trigger more-info-btn" href="#info-modal">More Info</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Add book modal -->
        <div id="book-modal" class="modal">
            <div class="modal-content">
                <h4>Add a New Book</h4>
                <div class="row">
                    <form class="col s12" id="book-form">
                        <div class="row">
                            <div class="input-field col s6">
                                <input id="title" type="text" class="validate">
                                <label for="title">Book Title</label>
                            </div>
                            <div class="input-field col s6">
                                <input id="author" type="text" class="validate">
                                <label for="author">Author</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <input id="isbn" type="text" class="validate">
                                <label for="isbn">ISBN (e.g., 9780441172719)</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="input-field col s12">
                                <textarea id="description" class="materialize-textarea" maxlength="120" data-length="120"></textarea>
                                <label for="description">Short Description</label>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <a href="#!" class="modal-close waves-effect waves-red btn-flat">Cancel</a>
                <a href="#!" id="form-submit" class="modal-close waves-effect waves-green btn">Save Book</a>
            </div>
        </div>

        <!-- Book details modal for "More Info" button-->
        <div id="info-modal" class="modal">
            <div class="modal-content">
                <h4 id="info-title">Book Title</h4>
                <p id="info-author"><strong>Author:</strong> </p>
                <p id="info-description"></p>
            </div>
            <div class="modal-footer">
                <a href="#!" class="modal-close waves-effect waves-green btn-flat">Close</a>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
