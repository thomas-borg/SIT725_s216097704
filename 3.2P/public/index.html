<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Tom's Bookshelf</title>
        <meta name="description" content="A simple bookshelf site for task 3.1P">
        <meta name="author" content="Tom Borg">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <nav>
            <div class="nav-wrapper navbar-size">
              <a href="" class="brand-logo center">Tom's BookShelf</a>

              <ul id="nav-mobile" class="left hide-on-med-and-down">
                  <li><a href="#">Wishlist</a></li>
                  <li><a href="#">Library</a></li>
              </ul>
            </div>
        </nav>

        <main class="container">
            <div class="row" id="card-section">
                <!-- Example Book Card (Repeat or generate via JS) -->
                <div class="col s12 m6 l4">
                    <div class="card hoverable">
                        <div class="card-image">
                            <img src="https://covers.openlibrary.org/b/isbn/9780441172719-L.jpg" alt="Dune Cover">
                          </div>
                          <div class="card-content">
                            <span class="card-title">Dune</span>
                            <p><strong>Author:</strong> Frank Herbert</p>
                            <p>A classic sci-fi novel set on the desert planet Arrakis.</p>
                        </div>
                        <div class="card-action">
                            <a class="modal-trigger" href="#book-modal">More Info</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
